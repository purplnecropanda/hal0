name: Nix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v20
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Evaluate flake outputs
        run: nix flake check --no-build --show-trace
      - name: Evaluate package
        run: nix eval .#packages.x86_64-linux.hal0.drvPath --raw
      - name: Evaluate NixOS module
        run: nix eval --impure --expr 'let f = builtins.getFlake (toString ./.); pkgs = f.inputs.nixpkgs.legacyPackages.x86_64-linux; in (pkgs.nixosSystem { modules = [ f.nixosModules.default { services.hal0.enable = true; services.hal0.package = pkgs.hello; services.hal0.hindsight.enable = false; services.hal0.openwebui.enable = false; services.hal0.hermes.enable = false; services.hal0.benchWorker.enable = false; services.hal0.comfyui.enable = false; } ]; }).config.systemd.services.hal0-api.serviceConfig.ExecStart' --show-trace
      - name: Evaluate native Hermes graph
        run: nix eval --impure --expr 'let f = builtins.getFlake (toString ./.); pkgs = f.inputs.nixpkgs.legacyPackages.x86_64-linux; cfg = (pkgs.nixosSystem { modules = [ f.nixosModules.default { services.hal0.enable = true; services.hal0.package = pkgs.hello; services.hal0.hindsight.enable = false; services.hal0.openwebui.enable = false; services.hal0.benchWorker.enable = false; services.hal0.comfyui.enable = false; } ]; }); in { provision = cfg.config.systemd.services.hal0-hermes-provision.serviceConfig.ExecStart; agent = cfg.config.systemd.services."hal0-agent@".serviceConfig.ExecStart; runtime = cfg.config.services.hal0.hermes.runtime; }' --show-trace
      - name: Build hal0 package
        run: nix build .#hal0 --no-link --print-build-logs

  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python distribution contract
        run: |
          test "$(python3 - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['name'])
          PY
          )" = hal0ai
          grep -q 'hal0 = "hal0.cli.main:app"' pyproject.toml
          grep -q 'hal0-agent = "hal0.cli.agent_shim:main"' pyproject.toml
      - name: Verify Nix packaging assets
        run: |
          test -f ui/package-lock.json
          test -f installer/wrappers/hal0-systemctl
          test -f installer/wrappers/hal0-benchctl
          test -f installer/wrappers/hal0-agentenv
          test -f installer/wrappers/hal0-podman-ro
          test -f installer/wrappers/hal0-update
          test -f installer/systemd/hal0-agent@.service
          test -f installer/systemd/hal0-bench.service
          test -f installer/systemd/hal0-bench.timer
          test -f installer/systemd/hindsight-api.service
          test -f packaging/systemd/hal0-openwebui.service
          test -f packaging/systemd/hal0-podman-forward.service
          test -f installer/etc-hal0/profiles.toml
          test -d installer/etc-hal0/slots
          test -f installer/comfyui/extra_model_paths.yaml
          test -f installer/agents/hermes/requirements.txt
