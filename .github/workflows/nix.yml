name: Nix

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Nix changes
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.filter.outputs.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            package:
              - 'flake.nix'
              - 'flake.lock'
              - 'pkgs/**'
              - 'modules/**'
              - 'nix/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/**'
              - 'ui/**'
              - 'installer/**'
              - 'packaging/**'
              - 'manifest.json'

  validate:
    name: Nix evaluation
    needs: changes
    if: needs.changes.outputs.package == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'pkgs/**/*.nix', 'modules/**/*.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4294967296

      - name: Evaluate flake outputs
        run: nix flake show --json --no-write-lock-file >/dev/null

      - name: Evaluate package
        run: nix eval .#packages.x86_64-linux.hal0.drvPath --raw --no-write-lock-file

      - name: Evaluate NixOS module
        run: >-
          nix eval --impure
          --expr 'let f = builtins.getFlake (toString ./.); pkgs = f.inputs.nixpkgs.legacyPackages.x86_64-linux; in
          (f.inputs.nixpkgs.lib.nixosSystem {
            system = "x86_64-linux";
            modules = [
              f.nixosModules.default
              {
                services.hal0.enable = true;
                services.hal0.package = pkgs.hello;
                services.hal0.hindsight.enable = false;
                services.hal0.openwebui.enable = false;
                services.hal0.hermes.enable = false;
                services.hal0.benchWorker.enable = false;
                services.hal0.comfyui.enable = false;
              }
            ];
          }).config.systemd.services.hal0-api.serviceConfig.ExecStart'
          --show-trace --no-write-lock-file

      - name: Evaluate native Hermes graph
        run: >-
          nix eval --impure
          --expr 'let f = builtins.getFlake (toString ./.); pkgs = f.inputs.nixpkgs.legacyPackages.x86_64-linux; cfg =
          (f.inputs.nixpkgs.lib.nixosSystem {
            system = "x86_64-linux";
            modules = [
              f.nixosModules.default
              {
                services.hal0.enable = true;
                services.hal0.package = pkgs.hello;
                services.hal0.hindsight.enable = false;
                services.hal0.openwebui.enable = false;
                services.hal0.benchWorker.enable = false;
                services.hal0.comfyui.enable = false;
              }
            ];
          }); in {
            provision = cfg.config.systemd.services.hal0-hermes-provision.serviceConfig.ExecStart;
            agent = cfg.config.systemd.services."hal0-agent@".serviceConfig.ExecStart;
            runtime = cfg.config.services.hal0.hermes.runtime;
          }'
          --show-trace --no-write-lock-file

  build:
    name: Build Nix package
    needs: [changes, validate]
    if: needs.changes.outputs.package == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'pkgs/**/*.nix', 'modules/**/*.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4294967296

      - name: Build hal0 package
        run: nix build .#hal0 --no-link --print-build-logs --no-write-lock-file
